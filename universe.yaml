# Investable universe for the scout.
# role:      core       -> can be selected as a holding
#            defensive  -> used when a slot has no eligible core ETF
#            benchmark  -> shown for comparison only
#            watch      -> ranked and shown, never proposed
# tob:       Belgian stock-exchange tax per side (0.0012 = 0.12%). VERIFY on your broker's
#            order ticket; entries marked verify=true were inferred from the sponsor's pattern.
# tickers:   Yahoo Finance symbols tried in order until one returns data.
# proxies:   longer-history stand-ins (US-listed twin or index, USD) used ONLY to extend the
#            backtest before the ETF existed; converted to EUR and scaled to splice seamlessly.
# fx:        Yahoo symbol for EUR/USD used to convert USD proxies.
fx: EURUSD=X
# cash_benchmark: the series used for the "beats cash" test (absolute momentum).

cash_benchmark: IBGS
equity_benchmark: IWDA
bond_benchmark: IBGM

